name: Format Managed Team Once

on:
  push:
    branches:
      - fix/a2-backend-routing-regression
    paths:
      - '.github/workflows/format-managed-team-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply oxfmt to Managed Team changes
        run: |
          bunx oxfmt \
            packages/desktop/src/renderer/pages/team/components/TeamCreateModal.tsx \
            packages/desktop/src/renderer/pages/team/components/memberPicker/TeamMemberDraftList.tsx \
            packages/desktop/src/renderer/pages/team/components/memberPicker/teamRolePermissions.ts \
            packages/desktop/src/renderer/pages/team/components/memberPicker/teamRoleProfiles.ts \
            packages/desktop/src/renderer/pages/team/hooks/useTeamSession.ts \
            tests/unit/teamRolePermissions.test.ts \
            tests/unit/teamRoleProfiles.test.ts

      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatter changes required."
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/desktop/src/renderer/pages/team/components/TeamCreateModal.tsx \
            packages/desktop/src/renderer/pages/team/components/memberPicker/TeamMemberDraftList.tsx \
            packages/desktop/src/renderer/pages/team/components/memberPicker/teamRolePermissions.ts \
            packages/desktop/src/renderer/pages/team/components/memberPicker/teamRoleProfiles.ts \
            packages/desktop/src/renderer/pages/team/hooks/useTeamSession.ts \
            tests/unit/teamRolePermissions.test.ts \
            tests/unit/teamRoleProfiles.test.ts
          git commit -m "style(team): apply oxfmt"
          git push origin HEAD:fix/a2-backend-routing-regression
