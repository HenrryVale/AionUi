name: Verify Managed Team v5

on:
  push:
    branches:
      - fix/a2-backend-routing-regression
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-managed-team-v5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    name: Source checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Python patch syntax
        run: python3 -m py_compile scripts/aioncore/patch-managed-skills.py

      - name: Managed Team role profile tests
        run: bunx vitest run --project node tests/unit/teamRoleProfiles.test.ts

      - name: Managed Team permission lifecycle tests
        run: bunx vitest run --project node tests/unit/teamRolePermissions.test.ts

      - name: Managed Team routing UI tests
        run: bunx vitest run --project dom tests/unit/renderer/messageTipsManagedSkillRouting.dom.test.tsx

      - name: Full Vitest regression suite
        run: bunx vitest run

      - name: TypeScript
        run: bunx tsc --noEmit

      - name: Lint changed Managed Team sources
        run: |
          bunx oxlint \
            packages/desktop/src/renderer/pages/team/components/TeamCreateModal.tsx \
            packages/desktop/src/renderer/pages/team/components/memberPicker/TeamMemberDraftList.tsx \
            packages/desktop/src/renderer/pages/team/components/memberPicker/teamRoleMemberLifecycle.ts \
            packages/desktop/src/renderer/pages/team/components/memberPicker/teamRolePermissions.ts \
            packages/desktop/src/renderer/pages/team/components/memberPicker/teamRoleProfiles.ts \
            packages/desktop/src/renderer/pages/team/hooks/useTeamSession.ts \
            tests/unit/teamRoleProfiles.test.ts \
            tests/unit/teamRolePermissions.test.ts \
            tests/unit/renderer/messageTipsManagedSkillRouting.dom.test.tsx

      - name: Format changed Managed Team sources
        run: |
          bunx oxfmt --check \
            packages/desktop/src/renderer/pages/team/components/TeamCreateModal.tsx \
            packages/desktop/src/renderer/pages/team/components/memberPicker/TeamMemberDraftList.tsx \
            packages/desktop/src/renderer/pages/team/components/memberPicker/teamRoleMemberLifecycle.ts \
            packages/desktop/src/renderer/pages/team/components/memberPicker/teamRolePermissions.ts \
            packages/desktop/src/renderer/pages/team/components/memberPicker/teamRoleProfiles.ts \
            packages/desktop/src/renderer/pages/team/hooks/useTeamSession.ts \
            tests/unit/teamRoleProfiles.test.ts \
            tests/unit/teamRolePermissions.test.ts \
            tests/unit/renderer/messageTipsManagedSkillRouting.dom.test.tsx

  aioncore-builder:
    name: Patched AionCore build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build AionCore stage and execute Dockerfile gates
        run: |
          docker build \
            --progress=plain \
            --target aioncore-builder \
            -t aionui-aioncore:v5-verify \
            .
